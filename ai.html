<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Nutrition Advisor - Nutrition Scanner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <ul id="navbar">
        <li style="font-family: Verdana, sans-serif">
          <a href="Index.html">Home</a>
        </li>
        <li style="font-family: Verdana, sans-serif"><a href="">Help</a></li>
      </ul>
      <a id="home" href="Index.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          fill="currentColor"
          class="bi bi-house-heart"
          viewBox="0 0 16 16"
        >
          <path
            d="M8 6.982C9.664 5.309 13.825 8.236 8 12 2.175 8.236 6.336 5.309 8 6.982"
          />
          <path
            d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.707L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.646a.5.5 0 0 0 .708-.707L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"
          />
        </svg>
      </a>
    </nav>

    <div id="title" style="margin-top: 70px">
      <div id="title2" style="text-align: center; margin: 0 auto">
        <div id="nutrition"><p>AI</p></div>
        <div id="scanner" style="font-size: 90px; margin-top: -40px">
          <p>Advisor</p>
        </div>
      </div>
    </div>

    <div class="introtext" style="margin-top: 20px">
      <p>
        Enter your personal data below and our AI will generate a personalized
        nutrition plan just for you.
      </p>
    </div>

    <div style="display: flex; justify-content: center; margin: 30px 6%">
      <div
        style="
          background: rgba(255, 255, 255, 0.22);
          box-shadow: 0 4px 30px rgba(0, 0, 0, 0.12);
          backdrop-filter: blur(6px);
          border: 1px solid rgba(255, 255, 255, 0.4);
          border-radius: 18px;
          padding: 35px 45px;
          width: 100%;
          max-width: 520px;
        "
      >
        <p
          style="
            color: #434924;
            font-family: Trattatello, fantasy;
            font-size: 28px;
            text-align: center;
            margin: 0 0 20px 0;
            padding: 0;
          "
        >
          Your Information
        </p>

        <form id="ai-form" style="width: 100%; margin: 0; padding: 0">
          <div style="margin-bottom: 16px">
            <label
              for="age"
              style="
                display: block;
                color: #0c3544;
                font-family: monospace;
                font-size: 16px;
                margin-bottom: 5px;
              "
              >Age (years)</label
            >
            <input
              type="number"
              id="age"
              min="1"
              max="120"
              placeholder="e.g. 25"
              required
              style="
                width: 100%;
                box-sizing: border-box;
                padding: 8px 10px;
                font-size: 15px;
                border-radius: 8px;
                border: none;
                background-color: #b8cdd0;
                color: #0c3544;
              "
            />
          </div>

          <div style="margin-bottom: 16px">
            <label
              for="weight"
              style="
                display: block;
                color: #0c3544;
                font-family: monospace;
                font-size: 16px;
                margin-bottom: 5px;
              "
              >Weight (kg)</label
            >
            <input
              type="number"
              id="weight"
              min="1"
              max="500"
              step="0.1"
              placeholder="e.g. 70"
              required
              style="
                width: 100%;
                box-sizing: border-box;
                padding: 8px 10px;
                font-size: 15px;
                border-radius: 8px;
                border: none;
                background-color: #b8cdd0;
                color: #0c3544;
              "
            />
          </div>

          <div style="margin-bottom: 16px">
            <label
              for="height"
              style="
                display: block;
                color: #0c3544;
                font-family: monospace;
                font-size: 16px;
                margin-bottom: 5px;
              "
              >Height (cm)</label
            >
            <input
              type="number"
              id="height"
              min="50"
              max="300"
              placeholder="e.g. 170"
              required
              style="
                width: 100%;
                box-sizing: border-box;
                padding: 8px 10px;
                font-size: 15px;
                border-radius: 8px;
                border: none;
                background-color: #b8cdd0;
                color: #0c3544;
              "
            />
          </div>

          <div style="margin-bottom: 16px">
            <label
              style="
                display: block;
                color: #0c3544;
                font-family: monospace;
                font-size: 16px;
                margin-bottom: 8px;
              "
              >Gender</label
            >
            <div
              style="
                display: flex;
                gap: 20px;
                font-family: monospace;
                color: #0c3544;
                font-size: 15px;
              "
            >
              <label
                ><input
                  type="radio"
                  name="gender"
                  value="male"
                  style="width: auto; margin-right: 6px"
                />Male</label
              >
              <label
                ><input
                  type="radio"
                  name="gender"
                  value="female"
                  style="width: auto; margin-right: 6px"
                />Female</label
              >
            </div>
          </div>

          <div style="margin-bottom: 24px">
            <label
              style="
                display: block;
                color: #0c3544;
                font-family: monospace;
                font-size: 16px;
                margin-bottom: 8px;
              "
              >Goal</label
            >
            <div
              style="
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                font-family: monospace;
                color: #0c3544;
                font-size: 15px;
              "
            >
              <label
                ><input
                  type="radio"
                  name="goal"
                  value="lose weight"
                  style="width: auto; margin-right: 6px"
                />Lose weight</label
              >
              <label
                ><input
                  type="radio"
                  name="goal"
                  value="gain weight"
                  style="width: auto; margin-right: 6px"
                />Gain weight</label
              >
              <label
                ><input
                  type="radio"
                  name="goal"
                  value="maintain weight"
                  style="width: auto; margin-right: 6px"
                />Maintain</label
              >
            </div>
          </div>

          <button
            type="submit"
            id="submit-btn"
            style="
              width: 100%;
              font-size: 18px;
              border: none;
              border-radius: 12px;
              padding: 13px;
              background: #32595c;
              color: #caa169;
              cursor: pointer;
              font-family: monospace;
              letter-spacing: 0.5px;
            "
          >
            Get My Nutrition Plan
          </button>
        </form>
      </div>
    </div>

    <div id="result-section" style="display: none; margin: 10px 6% 40px 6%">
      <div
        style="
          background: rgba(67, 73, 36, 0.9);
          border-radius: 18px;
          padding: 35px 40px;
          color: #d3bea0;
          font-family: monospace;
          font-size: 16px;
          line-height: 1.7;
        "
      >
        <p
          style="
            font-family: Trattatello, fantasy;
            font-size: 30px;
            color: #caa169;
            margin: 0 0 18px 0;
            padding: 0;
            text-align: center;
          "
        >
          Your Personalized Plan
        </p>
        <div id="result-content"></div>
      </div>
    </div>

    <div
      id="loading-section"
      style="
        display: none;
        text-align: center;
        margin: 30px;
        font-family: monospace;
        font-size: 18px;
        color: #434924;
      "
    >
      <div
        style="
          font-size: 40px;
          animation: spin 1.2s linear infinite;
          display: inline-block;
        "
      >
        &#9881;
      </div>
      <p style="margin-top: 10px">
        Analyzing your data and generating your plan...
      </p>
    </div>

    <style>
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <footer>
      <div id="footer">
        <h3>
           &#174 2026 &#8212; Gabrielle, Emily and Sergio| All rights Reserved
        </h3>
      </div>
    </footer>

    <script src="config.js"></script>
    <script type="module" src="ai.js"></script>
  </body>
</html>
